[workspace]
resolver = "3"
exclude = ["research"]
members = [
  "packages/bridge",
  "packages/sequences",
  "packages/core",
  "packages/core/js",
  "packages/core/py",
  "packages/core/cli",
  "packages/num",
  "packages/num/js",
  "packages/num/py",
  "packages/num/cli",
  "packages/math",
  "packages/math/js",
  "packages/math/py",
  "packages/math/cli",
  "packages/tile",
  "packages/tile/js",
  "packages/tile/py",
  "packages/tile/cli",
  "packages/life",
  "packages/life/js",
  "packages/life/py",
  "packages/life/cli",
  "packages/font",
  "packages/font/js",
  "packages/font/py",
  "packages/font/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly-core = { path = "packages/core", version = "0.2.0" }
mrly-num = { path = "packages/num", version = "0.2.0" }
mrly-math = { path = "packages/math", version = "0.2.0" }
mrly-tile = { path = "packages/tile", version = "0.2.0" }
mrly-life = { path = "packages/life", version = "0.2.0" }
mrly-font = { path = "packages/font", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.125"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
