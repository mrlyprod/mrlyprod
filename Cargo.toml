[workspace]
resolver = "3"
exclude = ["packages/cli", "data"]
members = ["packages/rs/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly-apollonian = { path = "packages/rs/apollonian", version = "0.2.0" }
mrly-arcs = { path = "packages/rs/arcs", version = "0.2.0" }
