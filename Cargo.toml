[workspace]
resolver = "2"
members = [
    "crates/mrlycore",
    "crates/mrlynum",
    "crates/mrlymath",
    "crates/mrlylab",
    "crates/mrlyweb",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
mrlycore = { path = "crates/mrlycore", version = "0.3.0" }
mrlynum = { path = "crates/mrlynum", version = "0.3.0" }
mrlymath = { path = "crates/mrlymath", version = "0.3.0" }
mrlylab = { path = "crates/mrlylab", version = "0.3.0" }
mrlyweb = { path = "crates/mrlyweb", version = "0.3.0" }
