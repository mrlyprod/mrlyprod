[workspace]
resolver = "2"
members = ["pkgs/mrlyrs", "crates/*", "figures", "research/lab/rs/*"]
default-members = ["pkgs/mrlyrs", "crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.fig]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[workspace.dependencies]
mrlylab = { path = "crates/mrlylab", version = "0.3.0" }
mrlyfig = { path = "crates/mrlyfig", version = "0.3.0" }
mrlydemo = { path = "crates/mrlydemo", version = "0.3.0" }
mrlyrs = { path = "pkgs/mrlyrs", version = "0.2.0" }
num-bigint = "0.4"
num-rational = "0.4"
faer = "0.24"
