[workspace]
resolver = "3"
exclude = ["research", "packages/cli", "data"]
members = [
  "packages/rs/wire",
  "packages/rs/bridge",
  "packages/rs/sequences",
  "packages/rs/core",
  "packages/rs/num",
  "packages/rs/math",
  "packages/rs/tile",
  "packages/rs/life",
  "packages/rs/font",
  "packages/rs/four",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly-wire = { path = "packages/rs/wire", version = "0.2.0" }
mrly-core = { path = "packages/rs/core", version = "0.2.0" }
mrly-num = { path = "packages/rs/num", version = "0.2.0" }
mrly-math = { path = "packages/rs/math", version = "0.2.0" }
mrly-tile = { path = "packages/rs/tile", version = "0.2.0" }
mrly-life = { path = "packages/rs/life", version = "0.2.0" }
mrly-font = { path = "packages/rs/font", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
