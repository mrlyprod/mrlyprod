[workspace]
resolver = "3"
members = ["crates/*", "crates/*/js", "crates/*/py", "crates/*/cli", "crates/*/js/hand", "crates/*/py/hand", "crates/*/cli/hand"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly-core = { path = "crates/core", version = "=0.2.0" }
mrly-num = { path = "crates/num", version = "=0.2.0" }
mrly-math = { path = "crates/math", version = "=0.2.0" }
mrly-tile = { path = "crates/tile", version = "=0.2.0" }
mrly-life = { path = "crates/life", version = "=0.2.0" }
mrly-font = { path = "crates/font", version = "=0.2.0" }
mrly-sequences = { path = "crates/sequences", version = "=0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.125"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
