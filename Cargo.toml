[workspace]
resolver = "3"
members = ["crates/*", "bindings/cli", "bindings/py", "bindings/js/hand", "bindings/js/units/*"]
default-members = ["crates/*", "bindings/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[workspace.dependencies]
mrly = { path = "crates/mrly", version = "=0.2.0" }
mrly-core = { path = "crates/mrly-core", version = "=0.2.0" }
mrly-num = { path = "crates/mrly-num", version = "=0.2.0" }
mrly-math = { path = "crates/mrly-math", version = "=0.2.0" }
mrly-tile = { path = "crates/mrly-tile", version = "=0.2.0" }
mrly-life = { path = "crates/mrly-life", version = "=0.2.0" }
mrly-font = { path = "crates/mrly-font", version = "=0.2.0" }
mrly-js-hand = { path = "bindings/js/hand" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.125"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
