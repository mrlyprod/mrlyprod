[package]
name = "mrly-math"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The designs: codes, cells, cubes and hexagons, their counts, graphs and names, digit designs on the line, and wheels."
readme = "../../README.md"
include = ["src/**", "bridge.toml", "manifest.json"]

[features]
js = ["mrly-core/js", "dep:wasm-bindgen", "dep:js-sys"]
py = ["mrly-core/py", "dep:pyo3"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
mrly-core.workspace = true
mrly-num.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
