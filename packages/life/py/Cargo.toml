[package]
name = "mrly-life-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Python bridge of mrly-life: the native half of mrly.life."
publish = false

[lib]
name = "_life"
crate-type = ["cdylib"]

[dependencies]
mrly-core.workspace = true
mrly-life.workspace = true
mrly-math = { workspace = true, features = ["py"] }
mrly-num.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json.workspace = true
