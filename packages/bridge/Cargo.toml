[package]
name = "mrly-bridge"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrlyprod/mrlyprod"
homepage = "https://mrly.net"
rust-version = "1.96"
description = "The bridge: one Rust unit in, its JS, Python and CLI leaves out."
readme = "../../README.md"
publish = false

[[bin]]
name = "mrly-bridge"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
