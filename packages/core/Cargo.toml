[package]
name = "mrly-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The substrate: tensors, cells, colors, images, resampling, seeded chance and the canonical names."
readme = "../../README.md"
include = ["src/**", "bridge.toml", "manifest.json"]

[features]
js = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
py = ["dep:pyo3", "dep:numpy", "dep:pythonize"]
cli = []

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
numpy = { version = "0.29", optional = true }
pythonize = { version = "0.29", optional = true }
