[project]
name = "mrly-tile"
dynamic = ["version"]
description = "mrly.tile, bridged into Python."
license = "MIT"
authors = [{ name = "MrlyProd, Inc." }]
requires-python = ">=3.10"
dependencies = ["numpy>=2", "mrly-core", "mrly-math", "mrly-num"]

[project.urls]
Homepage = "https://mrly.net"
Repository = "https://github.com/mrlyprod/mrlyprod"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "mrly.tile._tile"
python-source = "python"
config = ["profile.release.strip = false"]
exclude = ["**/__pycache__/**"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**/*.py*" }, { file = "../Cargo.toml" }, { file = "../src/**/*.rs" }]

[tool.uv.sources]
mrly-core = { path = "../../core/py" }
mrly-math = { path = "../../math/py" }
mrly-num = { path = "../../num/py" }

[tool.ruff]
target-version = "py310"
extend-exclude = ["python"]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B023", "BLE001", "UP031"]
