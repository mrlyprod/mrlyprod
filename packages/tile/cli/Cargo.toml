[package]
name = "mrly-tile-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The mrly-tile command: every public function of mrly-tile from the shell, JSON in, JSON out."
publish = false

[[bin]]
name = "mrly-tile"
path = "src/main.rs"

[dependencies]
mrly-core = { workspace = true, features = ["cli"] }
mrly-math.workspace = true
mrly-num.workspace = true
mrly-tile.workspace = true
serde_json.workspace = true
