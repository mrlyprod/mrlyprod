[package]
name = "mrly-font-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Python bridge of mrly-font: the native half of mrly.font."
publish = false

[lib]
name = "_font"
crate-type = ["cdylib"]

[dependencies]
mrly-core = { workspace = true, features = ["py"] }
mrly-font.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json.workspace = true
