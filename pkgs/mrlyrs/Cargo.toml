[package]
name = "mrlyrs"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MrlyMath, the mathematics of designs: the substrate, the integers, the designs in space, the life engine and the pixel alphabet in one crate."
homepage = "https://mrly.net"
readme = "README.md"
rust-version = "1.96"
keywords = ["mathematics", "fractal", "cellular-automata", "generative"]
categories = ["mathematics", "science", "multimedia::images"]
include = ["src/**", "README.md", "NAMES.md", "fixtures/**"]

[[bin]]
name = "mrly"
path = "src/bin/mrly.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
