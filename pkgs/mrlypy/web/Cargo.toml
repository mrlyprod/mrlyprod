[package]
name = "mrlypy-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "mrlypy_web"
crate-type = ["cdylib"]

[dependencies]
mrlycore = { path = "../../mrlyrs/mrlycore" }
mrlyfont = { path = "../../mrlyrs/mrlyfont" }
mrlyweb = { path = "../../mrlyrs/mrlyweb" }
mrlyos = { path = "../../mrlyrs/mrlyos" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
