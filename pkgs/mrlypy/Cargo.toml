[package]
name = "mrlypy"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Python bridge of MrlyMath."
publish = false

[lib]
name = "_mrlypy"
crate-type = ["cdylib"]

[dependencies]
mrlyrs = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
numpy = "0.29"
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
