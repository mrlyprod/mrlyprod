[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mrlyweb"
dynamic = ["version"]
description = "The Mrly world in Python: boot, list, call, read."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[tool.maturin]
module-name = "mrlyweb"
features = ["pyo3/extension-module"]
