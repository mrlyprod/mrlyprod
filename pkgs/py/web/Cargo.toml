[package]
name = "mrlyweb-py"
version.workspace = true
edition.workspace = true
description = "The Mrly world in Python: boot, list, call, read."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "mrlyweb_py"
crate-type = ["cdylib"]

[dependencies]
mrlycore = { workspace = true }
mrlyweb = { workspace = true }
mrlyos = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
