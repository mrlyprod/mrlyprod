[package]
name = "mrlypaint"
version.workspace = true
edition.workspace = true
description = "A pixel canvas in one ink color rolled from the seed: strokes turn cells on, and every reset rolls a fresh ink."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
mrlycore.workspace = true
mrlyos.workspace = true
mrlyskin.workspace = true

[dev-dependencies]
mrlycore = { workspace = true, features = ["testkit"] }
mrlyos = { workspace = true, features = ["testkit"] }
