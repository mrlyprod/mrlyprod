[package]
name = "mrlytile"
version.workspace = true
edition.workspace = true
description = "A studio for square tiles: five groups of designs, seeded rolls and paint, and knobs that snap to the nearest tile that builds."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
mrlycore.workspace = true
mrlymath.workspace = true
mrlyos.workspace = true
mrlyskin.workspace = true

[dev-dependencies]
mrlycore = { workspace = true, features = ["testkit"] }
mrlyos = { workspace = true, features = ["testkit"] }
