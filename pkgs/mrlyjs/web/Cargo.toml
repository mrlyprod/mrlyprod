[package]
name = "mrlyjs-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "mrlyjs"
crate-type = ["cdylib"]

[dependencies]
mrlycore = { path = "../../mrlyrs/mrlycore" }
mrlyweb = { path = "../../mrlyrs/mrlyweb" }
mrlyos = { path = "../../mrlyrs/mrlyos" }
mrlyui = { path = "../../mrlyrs/mrlyui" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
