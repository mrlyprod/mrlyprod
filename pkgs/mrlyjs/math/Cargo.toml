[package]
name = "mrlyjs-math"
version = "0.1.0"
edition = "2021"

[lib]
name = "mrlyjs_math"
crate-type = ["cdylib"]

[dependencies]
mrlycore = { path = "../../mrlyrs/mrlycore" }
mrlymath = { path = "../../mrlyrs/mrlymath" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
