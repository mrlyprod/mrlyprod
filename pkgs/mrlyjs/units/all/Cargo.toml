[package]
name = "mrlyjs_all"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The all wasm unit of mrlyjs: every module of mrlyrs in a browser."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mrlyrs.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
