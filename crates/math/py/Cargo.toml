[package]
name = "mrly-math-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Python bridge of mrly-math: the native half of mrly.math."
publish = false

[lib]
name = "_math"
crate-type = ["cdylib"]

[dependencies]
mrly-core.workspace = true
mrly-math.workspace = true
mrly-num.workspace = true
mrly-math-py-hand = { path = "hand" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json.workspace = true
