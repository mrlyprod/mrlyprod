[project]
name = "mrly-core"
dynamic = ["version"]
description = "mrly.core, bridged into Python."
license = "MIT"
authors = [{ name = "MrlyProd, Inc." }]
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.urls]
Homepage = "https://mrly.net"
Repository = "https://github.com/mrlyprod/mrlyprod"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "mrly.core._core"
python-source = "python"
config = ["profile.release.strip = false"]
exclude = ["**/__pycache__/**"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**/*.py*" }, { file = "../../../Cargo.toml" }, { file = "../src/**/*.rs" }, { file = "hand/**/*.rs" }]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
extend-exclude = ["python"]
