[project]
name = "mrly-num"
dynamic = ["version"]
description = "mrly.num, bridged into Python."
license = "MIT"
authors = [{ name = "MrlyProd, Inc." }]
requires-python = ">=3.10"
dependencies = ["numpy>=2", "mrly-core"]

[project.urls]
Homepage = "https://mrly.net"
Repository = "https://github.com/mrlyprod/mrlyprod"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "mrly.num._num"
python-source = "python"
config = ["profile.release.strip = false"]
exclude = ["**/__pycache__/**"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**/*.py*" }, { file = "../../../Cargo.toml" }, { file = "../../core/src/**/*.rs" }, { file = "../src/**/*.rs" }, { file = "../../core/py/hand/**/*.rs" }]

[tool.uv.sources]
mrly-core = { path = "../../core/py" }

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
extend-exclude = ["python"]
