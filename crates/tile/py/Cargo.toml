[package]
name = "mrly-tile-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Python bridge of mrly-tile: the native half of mrly.tile."
publish = false

[lib]
name = "_tile"
crate-type = ["cdylib"]

[dependencies]
mrly-core.workspace = true
mrly-math.workspace = true
mrly-num.workspace = true
mrly-tile.workspace = true
mrly-math-py-hand = { path = "../../math/py/hand" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json.workspace = true
