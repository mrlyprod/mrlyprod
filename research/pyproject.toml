[project]
name = "mrly-research"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "sympy>=1.14",
    "mpmath>=1.3",
    "scipy>=1.18",
    "pillow>=12",
]

[dependency-groups]
mrly = ["mrly"]

[tool.uv]
package = false

[tool.uv.sources]
mrly = { path = "../packages/py", editable = true }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B023", "BLE001", "UP031"]
