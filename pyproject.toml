[project]
name = "mrly-research"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "sympy>=1.14",
    "mpmath>=1.3",
    "scipy>=1.18",
    "pillow>=12",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B023", "BLE001", "UP031"]
